version: "3.8"

services:
  app:
    image: mcr.microsoft.com/devcontainers/php:1-8.3-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: abdou_casse_auto
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: abdou_casse_auto
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mysql-data:
